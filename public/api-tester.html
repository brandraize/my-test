<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Tester</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a3d2f 0%, #1a5c48 50%, #0a3d2f 100%);
            color: #333;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: #10b981;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .endpoint-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .endpoint-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .endpoint-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16, 185, 129, 0.4);
        }

        .endpoint-btn:active {
            transform: translateY(0);
        }

        .method-badge {
            display: inline-block;
            padding: 3px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            font-size: 0.75rem;
            margin-right: 8px;
        }

        .result-container {
            background: #f9fafb;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
            border: 2px solid #e5e7eb;
        }

        .result-title {
            color: #10b981;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #10b981;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        pre {
            background: #1f2937;
            color: #10b981;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            max-height: 500px;
            overflow-y: auto;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .status-indicator.online {
            background: #d1fae5;
            color: #065f46;
        }

        .status-indicator.offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.online {
            background: #10b981;
        }

        .status-dot.offline {
            background: #ef4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 API Integration Tester</h1>
        <p class="subtitle">Test Laravel Backend API Endpoints</p>
        
        <div id="status"></div>

        <div class="endpoint-grid">
            <button class="endpoint-btn" onclick="testEndpoint('/api/hero')">
                <span class="method-badge">GET</span> Hero Section
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/services')">
                <span class="method-badge">GET</span> All Services
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/projects')">
                <span class="method-badge">GET</span> All Projects
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/projects/featured')">
                <span class="method-badge">GET</span> Featured Projects
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/trainings')">
                <span class="method-badge">GET</span> All Training
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/team')">
                <span class="method-badge">GET</span> Team Members
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/about')">
                <span class="method-badge">GET</span> About Section
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/portfolio')">
                <span class="method-badge">GET</span> Portfolio
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/settings')">
                <span class="method-badge">GET</span> App Settings
            </button>
            <button class="endpoint-btn" onclick="testEndpoint('/api/contact-info')">
                <span class="method-badge">GET</span> Contact Info
            </button>
        </div>

        <div id="result" class="result-container" style="display: none;">
            <div class="result-title">
                <span id="result-title-text">Response</span>
                <span class="loading" id="loading" style="display: none;"></span>
            </div>
            <pre id="result-content"></pre>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';

        // Check if Laravel server is running
        async function checkServerStatus() {
            const statusDiv = document.getElementById('status');
            try {
                const response = await fetch(API_BASE_URL + '/api/hero');
                if (response.ok || response.status === 404) {
                    statusDiv.innerHTML = `
                        <div class="status-indicator online">
                            <span class="status-dot online"></span>
                            Laravel Server: Online ✓
                        </div>
                    `;
                } else {
                    throw new Error('Server not responding');
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="status-indicator offline">
                        <span class="status-dot offline"></span>
                        Laravel Server: Offline - Please start Laravel server (php artisan serve)
                    </div>
                `;
            }
        }

        async function testEndpoint(endpoint) {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('result-content');
            const resultTitleText = document.getElementById('result-title-text');
            const loading = document.getElementById('loading');

            resultDiv.style.display = 'block';
            loading.style.display = 'inline-block';
            resultTitleText.textContent = `Testing: ${endpoint}`;
            resultContent.textContent = 'Loading...';

            try {
                const response = await fetch(API_BASE_URL + endpoint);
                const data = await response.json();
                
                loading.style.display = 'none';
                resultTitleText.textContent = `✓ Response from ${endpoint}`;
                resultTitleText.className = 'result-title success';
                resultContent.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                loading.style.display = 'none';
                resultTitleText.textContent = `✗ Error from ${endpoint}`;
                resultTitleText.className = 'result-title error';
                resultContent.textContent = `Error: ${error.message}\n\nMake sure Laravel server is running:\nphp artisan serve`;
            }
        }

        // Check server status on page load
        checkServerStatus();
        
        // Check status every 5 seconds
        setInterval(checkServerStatus, 5000);
    </script>
</body>
</html>
